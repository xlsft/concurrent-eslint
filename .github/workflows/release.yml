name: Release

# Publishes to npm when a version tag is pushed:
#
#   npm run release          # patch bump, tag, push
#   npm run release:minor
#
# Uses npm trusted publishing (OIDC): no token to store. On npmjs.com, open
# the package → Settings → Trusted publishers and add this repository with
# the workflow file name "release.yml". Until that is configured, set an
# NPM_TOKEN secret instead and it is picked up automatically.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          [ "v$version" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      # Trusted publishing: no token, npm exchanges the job's OIDC token itself.
      - name: Publish (trusted publishing)
        if: env.NPM_TOKEN == ''
        run: npm publish --provenance --access public
      # Fallback: an NPM_TOKEN secret (granular automation token).
      - name: Publish (token)
        if: env.NPM_TOKEN != ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
